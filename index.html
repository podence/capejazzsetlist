<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cape Jazz & Blues - Setlist Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #161f30;
      --card-border: #23314c;
      --col-bg: #101624;
      --cape-periwinkle: #7C93D6;
      --cape-tagline: #8fa3de;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ready-a-bg: #064e3b;
      --ready-a-txt: #34d399;
      --ready-b-bg: #1e3a8a;
      --ready-b-txt: #93c5fd;
      --bass-bg: #581c87;
      --bass-txt: #d8b4fe;
      --horns-bg: #78350f;
      --horns-txt: #fcd34d;
      --cue-bg: #371923;
      --cue-border: #6d2335;
      --cue-txt: #fda4af;
      --sub-bg: #0d1320;

      --genre-jazz: #ffffff;
      --genre-blues: #7dd3fc;
      --genre-holiday: #fca5a5;
      --genre-other: #fef08a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #080c14;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-lockup {
      position: relative;
      display: inline-block;
      line-height: 0.9;
    }
    .brand-cape {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--cape-periwinkle);
      letter-spacing: -1px;
      display: block;
    }
    .brand-script {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      position: absolute;
      top: 12px;
      left: 16px;
      text-shadow: 2px 2px 0 #080c14, -2px -2px 0 #080c14;
      white-space: nowrap;
      pointer-events: none;
    }
    .brand-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--cape-tagline);
      text-transform: uppercase;
      margin-top: 4px;
      display: block;
    }

    .gig-title-input {
      background: #162032;
      border: 1px solid #283754;
      color: #f8fafc;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      width: 270px;
    }
    .gig-title-input:focus { outline: none; border-color: var(--cape-periwinkle); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #334155; border-color: #475569; }
    .btn-word {
      background: #1d4ed8;
      color: #ffffff;
      border: 1px solid #3b82f6;
    }
    .btn-word:hover { background: #2563eb; }

    main {
      flex: 1;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1.15fr 1fr 1fr;
      gap: 16px;
      max-width: 1650px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; }
    }

    .column {
      background: var(--col-bg);
      border: 1px solid #1f293d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 110px);
      min-height: 640px;
      overflow: hidden;
    }

    .column-header {
      padding: 12px 16px;
      border-bottom: 1px solid #1f293d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d121e;
    }
    .column-header h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #e2e8f0;
    }
    .column-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .column-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--cape-periwinkle);
      background: rgba(124, 147, 214, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .btn-cue {
      font-size: 11px;
      padding: 3px 7px;
      background: #24141c;
      border: 1px solid #54222f;
      color: #fda4af;
      border-radius: 5px;
      cursor: pointer;
    }

    .filter-panel {
      padding: 10px 14px;
      border-bottom: 1px solid #1f293d;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0b0f19;
    }
    .search-input {
      background: #182235;
      border: 1px solid #283754;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      outline: none;
      width: 100%;
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .chip {
      background: #182235;
      border: 1px solid #283754;
      color: #94a3b8;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 14px;
      cursor: pointer;
    }
    .chip.active { background: var(--cape-periwinkle); color: #0b0f19; border-color: var(--cape-periwinkle); }
    .chip-holiday.active { background: #b91c1c; color: #fee2e2; border-color: #ef4444; }

    .set-column-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .song-list-main {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reserve-section {
      background: var(--sub-bg);
      border-top: 1px solid #1f293d;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      max-height: 180px;
    }
    .reserve-header {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-list-reserve {
      min-height: 48px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border: 1px dashed #243249;
      border-radius: 6px;
      padding: 6px;
      background: #090e17;
    }

    /* Song Cards */
    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border
