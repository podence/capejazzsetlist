<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cape Jazz &amp; Blues Setlist Builder</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950">

  <!-- PUBLIC NOTICE BANNER -->
  <aside aria-label="Work in progress notice" class="bg-amber-500 text-slate-950 px-4 py-2 text-center text-xs md:text-sm font-extrabold tracking-widest uppercase shadow-md flex items-center justify-center gap-2">
    <span>⚠️</span>
    <span>CONSTRUCTION ZONE — ADDING FEATURES AND DEBUGGING</span>
    <span>⚠️</span>
  </aside>

  <!-- Visual Error Boundary Banner -->
  <div id="error-banner" class="hidden bg-rose-600 text-white px-4 py-3 fixed top-0 left-0 right-0 z-50 shadow-xl border-b border-rose-400">
    <div class="max-w-7xl mx-auto flex items-start justify-between">
      <div>
        <p class="font-bold tracking-wide">Application Runtime Error</p>
        <p id="error-msg" class="text-sm font-mono mt-1 opacity-95"></p>
      </div>
      <button onclick="document.getElementById('error-banner').classList.add('hidden')" class="px-2 py-1 text-sm bg-rose-800 hover:bg-rose-900 rounded font-bold">Dismiss</button>
    </div>
  </div>

  <!-- Header / Controls Bar -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Title Input -->
      <div class="flex items-center gap-3">
        <span class="text-xl">🎷</span>
        <input 
          id="gig-title" 
          type="text" 
          value="Set List Name" 
          class="bg-slate-950 border border-slate-700 hover:border-slate-600 focus:border-cyan-500 rounded px-3 py-1.5 font-bold text-lg text-white focus:outline-none transition w-60 md:w-80"
          placeholder="Gig / Setlist Name"
        />
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-reset" class="btn-action bg-rose-950 hover:bg-rose-900 border border-rose-700 text-rose-200 font-semibold shadow-sm">
          ↺ Reset All
        </button>
        <button id="btn-reload-sheet" class="btn-action bg-slate-800 hover:bg-slate-700 text-slate-200" title="Re-sync latest rows directly from Google Sheet">
          🔄 Sync Sheet
        </button>
        <button id="btn-open-import-modal"
