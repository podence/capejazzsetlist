<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cape Jazz & Blues - Setlist Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #161f30;
      --card-border: #23314c;
      --col-bg: #101624;
      --cape-periwinkle: #7C93D6;
      --cape-tagline: #8fa3de;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ready-a-bg: #064e3b;
      --ready-a-txt: #34d399;
      --ready-b-bg: #1e3a8a;
      --ready-b-txt: #93c5fd;
      --bass-bg: #581c87;
      --bass-txt: #d8b4fe;
      --horns-bg: #78350f;
      --horns-txt: #fcd34d;
      --cue-bg: #371923;
      --cue-border: #6d2335;
      --cue-txt: #fda4af;
      --sub-bg: #0d1320;

      --genre-jazz: #ffffff;
      --genre-blues: #7dd3fc;
      --genre-holiday: #fca5a5;
      --genre-other: #fef08a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #080c14;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-lockup {
      position: relative;
      display: inline-block;
      line-height: 0.9;
    }
    .brand-cape {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--cape-periwinkle);
      letter-spacing: -1px;
      display: block;
    }
    .brand-script {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      position: absolute;
      top: 12px;
      left: 16px;
      text-shadow: 2px 2px 0 #080c14, -2px -2px 0 #080c14;
      white-space: nowrap;
      pointer-events: none;
    }
    .brand-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--cape-tagline);
      text-transform: uppercase;
      margin-top: 4px;
      display: block;
    }
